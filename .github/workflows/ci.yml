name: CI

on:
  pull_request:
  push:
    branches: [master]

# Keyless auth to GCP needs an OIDC token.
permissions:
  contents: read
  id-token: write

# One in-flight run per ref; a newer push supersedes an older one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1. Unit tests. The site has no database, so there is no service to stand up.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Test
        run: npm test

  # 2. Build the runtime image and smoke-test it.
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build app image
        run: docker build -t adl-app:ci -f Dockerfile .
      - name: Start the app image
        run: |
          docker run -d --name adl-app --network host \
            -e PORT=8080 \
            adl-app:ci
      - name: Smoke-test every page
        run: |
          for i in $(seq 1 20); do
            if curl -fsS -o /dev/null http://localhost:8080/healthz; then break; fi
            if [ "$i" = 20 ]; then
              echo "app never became healthy"; docker logs adl-app; exit 1
            fi
            sleep 2
          done
          for path in / /life /work /habits /books; do
            echo "GET $path"
            curl -fsS -o /dev/null "http://localhost:8080$path"
          done
          echo "all pages OK"
      - name: Teardown
        if: always()
        run: docker rm -f adl-app || true

  # 3. Push the image to Artifact Registry (master only).
  push:
    needs: build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet
      - name: Build & push app image
        run: |
          APP="${{ vars.GCP_AR_REPO }}/app"
          docker build -t "$APP:${{ github.sha }}" -t "$APP:latest" -f Dockerfile .
          docker push "$APP:${{ github.sha }}"
          docker push "$APP:latest"

  # 4. Deploy a no-traffic candidate, smoke-test it, then shift traffic.
  #    A failed smoke test leaves the old revision serving.
  deploy:
    needs: push
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Deploy candidate revision (no traffic)
        id: candidate
        run: |
          SHORT="$(echo "${{ github.sha }}" | cut -c1-8)"
          gcloud run deploy "${{ vars.CLOUD_RUN_SERVICE }}" \
            --image "${{ vars.GCP_AR_REPO }}/app:${{ github.sha }}" \
            --region "${{ vars.GCP_REGION }}" \
            --no-traffic \
            --tag "candidate-$SHORT"
          CAND_URL="$(gcloud run services describe "${{ vars.CLOUD_RUN_SERVICE }}" \
            --region "${{ vars.GCP_REGION }}" --format=json \
            | jq -r --arg t "candidate-$SHORT" '.status.traffic[] | select(.tag==$t) | .url')"
          echo "url=$CAND_URL" >> "$GITHUB_OUTPUT"

      - name: Smoke-test the candidate
        run: |
          set -e
          # Cloud Run's front end reserves /healthz externally (its own probes
          # still hit it internally to gate readiness), so smoke-test the real
          # public routes instead.
          for path in / /life /work /habits /books; do
            echo "GET $path"
            curl -fsS -o /dev/null "${{ steps.candidate.outputs.url }}$path"
          done

      - name: Shift 100% traffic to the new revision
        run: |
          gcloud run services update-traffic "${{ vars.CLOUD_RUN_SERVICE }}" \
            --region "${{ vars.GCP_REGION }}" --to-latest
